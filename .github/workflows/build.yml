name: Сборка OpenWrt APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Проверить исходники
        run: make test
      - name: Собрать APK для OpenWrt 25.12
        run: make sdk-build
      - name: Подготовить файлы выпуска
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for package in podkop-subscriptions luci-app-podkop-subscriptions; do
            matches=(bin/"$package"-*.apk)
            test "${#matches[@]}" -eq 1
            test -f "${matches[0]}"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              test "${matches[0]}" = "bin/$package-${GITHUB_REF_NAME#v}.apk"
            fi
            cp "${matches[0]}" "release/$package.apk"
          done
          cd release
          sha256sum podkop-subscriptions.apk luci-app-podkop-subscriptions.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-mediatek-filogic
          path: release/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12-mediatek-filogic
          path: release/
      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
